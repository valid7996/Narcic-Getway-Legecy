name: android-natives

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  SNISPOOF_VERSION: "v0.7.2"
  HEV_RELEASE: "2.18.0"
  ZEPTUN_RELEASE: "v1.1.1"

jobs:
  go-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }

      - name: SNI-spoof for every ABI
        run: |
          set -e
          NDK="$ANDROID_HOME/ndk/$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -1)"
          git clone -q --depth 1 -b "$SNISPOOF_VERSION" https://github.com/aleskxyz/SNI-Spoofing-Go.git snispoof
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for triple in "arm64:arm64-v8a:aarch64-linux-android21-clang" \
                        "arm:armeabi-v7a:armv7a-linux-androideabi21-clang" \
                        "amd64:x86_64:x86_64-linux-android21-clang"; do
            arch=${triple%%:*}; rest=${triple#*:}; abi=${rest%%:*}; cc=${rest#*:}
            mkdir -p "out/$abi"
            export CGO_ENABLED=1 CC="$BIN/$cc" GOOS=android GOARCH=$arch GOARM=7
            ( cd snispoof && go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/out/$abi/libsnispoof.so" . )
          done
          ls -lR out
      - uses: actions/upload-artifact@v4
        with: { name: native-go, path: "out/*", retention-days: 5 }

  hev:
    runs-on: ubuntu-latest
    steps:
      - name: hev-socks5-tunnel built as the JNI library the app loads
        run: |
          set -e
          git clone -q --depth 1 --branch "$HEV_RELEASE" --recursive https://github.com/heiher/hev-socks5-tunnel hev/jni
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          "$NDK/ndk-build" -C hev -j"$(nproc)" APP_ABI="arm64-v8a armeabi-v7a x86_64" APP_PLATFORM=android-21 APP_MODULES=hev-socks5-tunnel
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="hev/libs/$abi/libhev-socks5-tunnel.so"
            readelf -h "$so" | grep -q 'DYN (Shared object file)' || { echo "::error::$abi: hev is not a shared library"; exit 1; }
            readelf --dyn-syms -W "$so" | grep -qw JNI_OnLoad || { echo "::error::$abi: hev has no JNI_OnLoad"; exit 1; }
            grep -aq 'hev/htproxy/TProxyService' "$so" || { echo "::error::$abi: hev does not bind hev.htproxy.TProxyService"; exit 1; }
            mkdir -p "out/$abi" && cp "$so" "out/$abi/"
          done
          ls -lR out
      - uses: actions/upload-artifact@v4
        with: { name: native-hev, path: "out/*", retention-days: 5 }

  prebuilt:
    runs-on: ubuntu-latest
    steps:
      - name: zeptun from its own release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p out
          gh release download "$ZEPTUN_RELEASE" --repo Noisemux/zeptun \
            --pattern 'zeptun-android-jniLibs.zip' --output zeptun.zip --clobber
          unzip -q -o zeptun.zip -d zep
          cp -r zep/jniLibs/* out/
          find out -type f -exec chmod +x {} +
          ls -lR out
      - uses: actions/upload-artifact@v4
        with: { name: native-prebuilt, path: "out/*", retention-days: 5 }
